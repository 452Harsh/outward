<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outward demo cards</title>
<style>
@font-face { font-family: 'Baloo 2'; src: url('../app/src/assets/fonts/baloo-2.woff2') format('woff2'); font-weight: 400 800; }
@font-face { font-family: 'Atkinson Hyperlegible Next'; src: url('../app/src/assets/fonts/atkinson-hyperlegible-next.woff2') format('woff2'); font-weight: 200 800; }
:root {
  --forest: #1f6b4a; --leaf: #49b86e; --sunrise: #ff7a2f; --amber: #ffc23d; --sky: #38a3e8;
  --ink: #17251f; --bg: #fff8ec; --surface: #ffffff; --surface-2: #f3ead8; --muted: #5b6b62; --line: #e6dcc6;
  --font-display: 'Baloo 2', sans-serif; --font-body: 'Atkinson Hyperlegible Next', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
.frame { position: absolute; inset: 0; overflow: hidden; }
.glow { position: absolute; border-radius: 50%; filter: blur(2px); }
.glow.a { width: 900px; height: 900px; right: -260px; bottom: -420px; background: radial-gradient(circle, color-mix(in srgb, var(--amber) 55%, transparent), transparent 65%); }
.glow.b { width: 700px; height: 700px; left: -300px; top: -300px; background: radial-gradient(circle, color-mix(in srgb, var(--sky) 22%, transparent), transparent 65%); }
.trail { position: absolute; left: 0; bottom: 0; width: 1920px; height: 260px; opacity: .55; }
h1, h2 { font-family: var(--font-display); margin: 0; line-height: .95; }
.eyebrow { font-weight: 700; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 26px; padding: 12px 22px; border-radius: 999px; background: var(--surface); border: 3px solid var(--line); }
.pill.hot { background: var(--sunrise); border-color: var(--sunrise); color: #1b1206; }
.pill.sky { background: var(--sky); border-color: var(--sky); color: #fff; }

/* App segment background: text left, phone right */
.left { position: absolute; left: 140px; top: 0; bottom: 0; width: 900px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
.left h1 { font-size: 104px; font-weight: 800; }
.left .sub { font-size: 40px; color: var(--muted); max-width: 820px; }
.left .tags { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
.step { display: flex; gap: 10px; }
.step i { width: 46px; height: 10px; border-radius: 999px; background: var(--line); }
.step i.on { background: var(--sunrise); }
.phone { position: absolute; left: 1202px; top: 38px; width: 476px; height: 1004px; border-radius: 64px; background: var(--ink); box-shadow: 0 30px 60px rgba(23,37,31,.18); }
.screen-hole { position: absolute; left: 22px; top: 22px; width: 432px; height: 960px; border-radius: 44px; background: #000; }

/* Intro / outro */
.hero { position: absolute; left: 150px; top: 170px; width: 1000px; display: grid; gap: 28px; }
.hero h1 { font-size: 220px; font-weight: 800; letter-spacing: -.01em; }
.hero .sub { font-size: 58px; font-family: var(--font-display); font-weight: 700; color: var(--sunrise); }
.hero .lines { display: grid; gap: 14px; font-size: 34px; color: var(--muted); }
.hero .chips { display: flex; flex-wrap: wrap; gap: 14px; }
.chip-in { opacity: 0; transform: translateY(18px); animation: chipIn .6s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes chipIn { to { opacity: 1; transform: none; } }
.sprig.sprig-big { position: absolute; right: 170px; bottom: 150px; width: 470px; }
.links { display: grid; gap: 12px; font-size: 34px; font-weight: 700; }
.links span { color: var(--muted); font-weight: 400; }

/* Results */
.results { position: absolute; left: 140px; top: 90px; right: 140px; display: grid; gap: 30px; }
.results h1 { font-size: 92px; font-weight: 800; }
.results .sub { font-size: 34px; color: var(--muted); }
.board { display: grid; grid-template-columns: 1fr; gap: 18px; width: 1180px; }
.row { display: grid; grid-template-columns: 460px 1fr 140px; align-items: center; gap: 24px; font-size: 30px; }
.row .name b { font-family: var(--font-display); font-size: 34px; display: block; line-height: 1.05; }
.row .name span { color: var(--muted); font-size: 22px; }
.bar { height: 46px; border-radius: 999px; background: var(--surface-2); border: 3px solid var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; border-radius: 999px; animation: grow 1.4s cubic-bezier(.3,1.3,.5,1) forwards; }
@keyframes grow { to { width: var(--w); } }
.score { font-family: var(--font-display); font-weight: 800; font-size: 54px; text-align: right; }
.row.star .name b { color: var(--sunrise); }
.facts { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; }
.sprig.sprig-side { position: absolute; right: 110px; bottom: 120px; width: 300px; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<style>
/* ---------- Sprig: the companion (SVG + CSS) ---------- */
.sprig { width: 100%; height: auto; overflow: visible; display: block; }
.sprig * { transform-box: fill-box; }
.sprig .shadow { fill: rgba(23,37,31,.14); }
.sprig .bob, .sprig .breath { transform-origin: 50% 100%; }
.sprig .leg { transform-origin: 50% 0; }
.sprig .arm-rot { transform-origin: 50% 0; transform: rotate(var(--a)); }
.sprig .arm.l .arm-rot { --a: var(--la, 14deg); }
.sprig .arm.r .arm-rot { --a: var(--ra, -14deg); }
.sprig .sprout { transform-origin: 50% 100%; }
.sprig .eyes { transform-origin: 50% 50%; }
.sprig .pupils { transform-origin: 50% 50%; }
.sprig .tail { transform-origin: 30% 0; }
.sprig .mouth-open { transform-origin: 50% 30%; transform: scaleY(calc(.25 + var(--mouth, 0) * 1.1)); }
.sprig .thought, .sprig .rings, .sprig .zzz, .sprig .map, .sprig .eyes-closed, .sprig .eyes-happy, .sprig .mouth-open, .sprig .mouth-o, .sprig .mouth-big { opacity: 0; }
.sprig .ring { transform-origin: 50% 50%; transform: scale(calc(.6 + var(--level, .3) * 1.2)); }

/* idle */
.sprig .breath { animation: breathe 3.2s ease-in-out infinite; }
.sprig .eyes { animation: blink 5.2s infinite; }
.sprig .pupils { animation: look 8s ease-in-out infinite; }
.sprig .sprout { animation: sway 4s ease-in-out infinite; }
.sprig .tail { animation: flutter 3s ease-in-out infinite; }
.sprig[data-state="idle"] .arm.r .arm-rot { animation: wave 9s ease-in-out infinite; }
.sprig[data-pose="map"] .arm.l .arm-rot { --a: -62deg; animation: none; }
.sprig[data-pose="map"] .arm.r .arm-rot { --a: 62deg; animation: none; }
.sprig[data-pose="map"] .map { opacity: 1; }
.sprig[data-pose="map"] .pupils { animation: none; transform: translate(0, 4px); }

/* walking */
.sprig[data-state="walking"] .leg.l { animation: stepL var(--step, .7s) ease-in-out infinite; }
.sprig[data-state="walking"] .leg.r { animation: stepL var(--step, .7s) ease-in-out infinite reverse; }
.sprig[data-state="walking"] .bob { animation: bob calc(var(--step, .7s) / 2) ease-in-out infinite; }
.sprig[data-state="walking"] .arm.l .arm-rot { animation: swing var(--step, .7s) ease-in-out infinite; }
.sprig[data-state="walking"] .arm.r .arm-rot { animation: swing var(--step, .7s) ease-in-out infinite reverse; --a: -14deg; }
.sprig[data-state="walking"] .tail { animation-duration: calc(var(--step, .7s) * 1.4); }
.sprig[data-state="walking"] .pupils { animation: none; transform: translate(3px, 0); }

/* thinking */
.sprig[data-state="thinking"] { --ra: 122deg; }
.sprig[data-state="thinking"] .breath { animation: tilt 4s ease-in-out infinite; }
.sprig[data-state="thinking"] .pupils { animation: none; transform: translate(4px, -4px); }
.sprig[data-state="thinking"] .brow.r { transform: translateY(-4px); }
.sprig[data-state="thinking"] .thought { opacity: 1; }
.sprig .thought .dot { animation: dots 1.2s ease-in-out infinite; }
.sprig .thought .dot:nth-child(2) { animation-delay: .2s; }
.sprig .thought .dot:nth-child(3) { animation-delay: .4s; }
.sprig .orbit { transform-origin: 50% 50%; animation: orbit 4s linear infinite; }

/* speaking */
.sprig[data-state="speaking"] { --la: 40deg; }
.sprig[data-state="speaking"] .mouth-smile { opacity: 0; }
.sprig[data-state="speaking"] .mouth-open { opacity: 1; }
.sprig[data-state="speaking"] .arm.l .arm-rot { animation: gesture 2.4s ease-in-out infinite; }

/* listening */
.sprig[data-state="listening"] { --la: 168deg; }
.sprig[data-state="listening"] .bob { transform: rotate(-7deg); }
.sprig[data-state="listening"] .rings { opacity: 1; }
.sprig[data-state="listening"] .pupils { animation: none; transform: translate(-4px, 0); }
.sprig[data-state="listening"] .mouth-smile { opacity: 0; }
.sprig[data-state="listening"] .mouth-o { opacity: 1; }

/* celebrating */
.sprig[data-state="celebrating"] { --la: 150deg; --ra: -150deg; }
.sprig[data-state="celebrating"] .bob { animation: jump .9s cubic-bezier(.3,.7,.4,1) infinite; }
.sprig[data-state="celebrating"] .arm.l .arm-rot { animation: pump .45s ease-in-out infinite alternate; }
.sprig[data-state="celebrating"] .arm.r .arm-rot { animation: pump .45s ease-in-out infinite alternate-reverse; }
.sprig[data-state="celebrating"] .eyes-open { opacity: 0; }
.sprig[data-state="celebrating"] .eyes-happy { opacity: 1; }
.sprig[data-state="celebrating"] .mouth-smile { opacity: 0; }
.sprig[data-state="celebrating"] .mouth-big { opacity: 1; }
.sprig[data-state="celebrating"] .sprout { animation: perk .45s ease-in-out infinite alternate; }

/* sleepy */
.sprig[data-state="sleepy"] { --la: 8deg; --ra: -8deg; filter: saturate(.75); }
.sprig[data-state="sleepy"] .breath { animation: sleepyBreath 5s ease-in-out infinite; }
.sprig[data-state="sleepy"] .eyes-open { opacity: 0; }
.sprig[data-state="sleepy"] .eyes-closed { opacity: 1; }
.sprig[data-state="sleepy"] .sprout { animation: none; transform: rotate(38deg); }
.sprig[data-state="sleepy"] .zzz { opacity: 1; }
.sprig .zzz text { animation: zfloat 3s ease-in infinite; transform-origin: 50% 50%; }
.sprig .zzz text:nth-child(2) { animation-delay: 1s; }
.sprig .zzz text:nth-child(3) { animation-delay: 2s; }
.sprig[data-state="sleepy"] .arm.r .arm-rot { animation: none; }

/* ready (mission start: stretch, then tug the straps) */
.sprig[data-state="ready"] .arm.l .arm-rot { animation: stretchL 3.4s ease-in-out infinite; }
.sprig[data-state="ready"] .arm.r .arm-rot { animation: stretchR 3.4s ease-in-out infinite; }
.sprig[data-state="ready"] .breath { animation: stretchBody 3.4s ease-in-out infinite; }

/* waving goodbye */
.sprig[data-state="wave"] .arm.r .arm-rot { animation: waveLoop 1s ease-in-out infinite; }

@keyframes breathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.035); } }
@keyframes sleepyBreath { 0%,100% { transform: rotate(4deg) scale(1, 1); } 50% { transform: rotate(4deg) scale(1.02, 1.05); } }
@keyframes tilt { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(5deg) scale(1.01); } }
@keyframes blink { 0%,46%,50%,100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
@keyframes look { 0%,30% { transform: translate(0,0); } 38%,55% { transform: translate(-4px,0); } 62%,80% { transform: translate(4px,-1px); } 88%,100% { transform: translate(0,0); } }
@keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
@keyframes flutter { 0%,100% { transform: rotate(-4deg) skewX(-3deg); } 50% { transform: rotate(8deg) skewX(4deg); } }
@keyframes wave { 0%,70%,100% { transform: rotate(var(--a)); } 74% { transform: rotate(-150deg); } 78% { transform: rotate(-128deg); } 82% { transform: rotate(-156deg); } 86% { transform: rotate(-130deg); } 90% { transform: rotate(-150deg); } }
@keyframes waveLoop { 0%,100% { transform: rotate(-150deg); } 50% { transform: rotate(-122deg); } }
@keyframes stepL { 0%,100% { transform: rotate(22deg); } 50% { transform: rotate(-22deg); } }
@keyframes swing { 0%,100% { transform: rotate(calc(var(--a) - 26deg)); } 50% { transform: rotate(calc(var(--a) + 26deg)); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes dots { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes gesture { 0%,100% { transform: rotate(40deg); } 50% { transform: rotate(62deg); } }
@keyframes jump { 0%,100% { transform: translateY(0) scale(1.03, .96); } 45% { transform: translateY(-26px) scale(.98, 1.03); } }
@keyframes pump { from { transform: rotate(var(--a)); } to { transform: rotate(calc(var(--a) * .82)); } }
@keyframes perk { from { transform: rotate(-10deg) scale(1); } to { transform: rotate(10deg) scale(1.12); } }
@keyframes zfloat { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(14px,-30px); opacity: 0; } }
@keyframes stretchL { 0%,10% { transform: rotate(14deg); } 30%,48% { transform: rotate(176deg); } 62%,100% { transform: rotate(-30deg); } }
@keyframes stretchR { 0%,10% { transform: rotate(-14deg); } 30%,48% { transform: rotate(-176deg); } 62%,100% { transform: rotate(30deg); } }
@keyframes stretchBody { 0%,10%,62%,100% { transform: scale(1,1); } 30%,48% { transform: scale(.97,1.07); } }

/* Paused when the page is hidden; calm mode for reduced motion */
.paused .sprig *, .paused .confetti i { animation-play-state: paused !important; }
.calm .sprig *, .calm .sprig { animation: none !important; }
.calm .sprig[data-state="celebrating"] .bob { transform: translateY(-10px); }
@media (prefers-reduced-motion: reduce) {
  .sprig *, .sprig { animation: none !important; }
  .sprig[data-state="celebrating"] .bob { transform: translateY(-10px); }
}


</style>

<script>
const q = new URLSearchParams(location.search);
const card = q.get('card');
const frame = document.getElementById('frame');
const tpl = document.getElementById('sprig-tpl');
const sprig = (state, cls) => { const s = tpl.content.firstElementChild.cloneNode(true); s.dataset.state = state; s.classList.add(cls); return s; };
const trail = `<svg class="trail" viewBox="0 0 1920 260" aria-hidden="true"><path d="M-20 220 C300 120 520 250 820 170 S1350 60 1600 150 S1900 210 1960 120" fill="none" stroke="var(--line)" stroke-width="22" stroke-linecap="round" stroke-dasharray="4 40"/></svg>`;
frame.innerHTML = `<div class="glow a"></div><div class="glow b"></div>${trail}`;

if (card === 'bg') {
  const seg = JSON.parse(q.get('seg'));
  frame.insertAdjacentHTML('beforeend', `
    <div class="left">
      <div class="step">${Array.from({ length: seg.of }, (_, i) => `<i class="${i < seg.n ? 'on' : ''}"></i>`).join('')}</div>
      <span class="eyebrow">Live demo · ${seg.n} of ${seg.of}</span>
      <h1>${seg.title}</h1>
      <p class="sub">${seg.subtitle}</p>
      <div class="tags">${(seg.tags || []).map((t, i) => `<span class="pill ${seg.airplane && i === 0 ? '' : ''}">${t}</span>`).join('')}${seg.airplane ? '<span class="pill hot"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="currentColor"/></svg>Airplane mode on</span>' : ''}${seg.speed ? `<span class="pill sky">Walk sped up ${seg.speed}×</span>` : ''}</div>
    </div>
    <div class="phone"><div class="screen-hole"></div></div>`);
}

if (card === 'intro' || card === 'outro') {
  const intro = card === 'intro';
  frame.insertAdjacentHTML('beforeend', `
    <div class="hero">
      <span class="eyebrow">${intro ? 'A hackathon project' : 'Thanks for watching'}</span>
      <h1>Outward</h1>
      <span class="sub">Your story happens outside.</span>
      ${intro ? `<div class="chips">
        ${['Works offline', 'AI runs on the phone', 'Open models', 'Phone stays in your pocket'].map((c, i) => `<span class="pill chip-in" style="animation-delay:${2.2 + i * 2.6}s">${c}</span>`).join('')}
      </div>` : `<div class="links">
        <div>github.com/452Harsh/outward <span>· code</span></div>
        <div>huggingface.co/Harsh452/outward-gemma3-270m <span>· model</span></div>
      </div>`}
    </div>`);
  frame.appendChild(sprig(intro ? 'idle' : 'wave', 'sprig-big'));
}

if (card === 'results') {
  const rows = [
    ['Stock Gemma 3 270M', 'same prompt, on the phone', 2.55, 'var(--muted)'],
    ['Stock Gemma 3 270M', 'with a worked example', 3.66, 'var(--sky)'],
    ['Qwen3.5-4B teacher', 'LoRA fine-tuned on Tinker', 4.79, 'var(--leaf)'],
    ['Outward Gemma 3 270M', 'distilled, 241 MB, offline', 4.75, 'var(--sunrise)', true],
  ];
  frame.insertAdjacentHTML('beforeend', `
    <div class="results">
      <span class="eyebrow">Open models, made smaller</span>
      <h1>Teacher on Tinker → student in your pocket</h1>
      <p class="sub">Story quality on 50 held-out prompts × 3 samples (rubric score out of 5)</p>
      <div class="board">${rows.map(([n, s, v, c, star], i) => `
        <div class="row ${star ? 'star' : ''}"><div class="name"><b>${n}</b><span>${s}</span></div>
        <div class="bar"><span style="--w:${(v / 5) * 100}%;background:${c};animation-delay:${0.8 + i * 0.5}s"></span></div>
        <div class="score">${v.toFixed(2)}</div></div>`).join('')}
      </div>
      <div class="facts">
        <span class="pill">Unsafe outputs: 27 → 2 of 150</span>
        <span class="pill">Steers away from risky finds: 14% → 44%</span>
        <span class="pill hot">All Tinker training: $2.56</span>
      </div>
    </div>`);
  frame.appendChild(sprig('celebrating', 'sprig-side'));
}
</script>
</body>
</html>
