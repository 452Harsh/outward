# One-click deploy: Render dashboard → New → Blueprint → pick this repo.
# Cost (paid Starter plan + disk) is estimated in docs/render-costs.md. Review it before applying.
services:
  - type: web
    name: outward
    runtime: node
    plan: starter            # $7/month, no sleeping
    region: singapore        # closest Render region to India
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MODELS_DIR
        value: /var/data/models
      # After this much model traffic in a month, /models redirects to Hugging Face.
      - key: MODEL_BANDWIDTH_BUDGET_GB
        value: "60"
    # Model weights served from Render (270M only; the optional 1B comes from Hugging Face).
    # The server fills this disk from Hugging Face on boot. Disks can grow later but never shrink.
    disk:
      name: outward-data
      mountPath: /var/data
      sizeGB: 1
